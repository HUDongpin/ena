name: Open ENA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-ena-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Verify vendored j-3dENA custody before dependency installation
        run: node scripts/verify-j3dena-vendor.mjs
      - run: npm ci
      - name: Verify complete installed j-3dENA tree and jENA workspace peer
        run: node scripts/verify-j3dena-vendor.mjs --require-installed
      - name: Audit the production dependency graph
        run: npm audit --omit=dev
      - name: Reject high or critical development-tool advisories
        run: npm audit --audit-level=high
      - name: Verify prompt governance and complete application
        run: npm run verify

  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Verify vendored j-3dENA custody before dependency installation
        run: node scripts/verify-j3dena-vendor.mjs
      - run: npm ci
      - name: Verify complete installed j-3dENA tree and jENA workspace peer
        run: node scripts/verify-j3dena-vendor.mjs --require-installed
      - name: Build the pinned jENA workspace
        run: npm run jena:build
      - name: Verify j-3dENA through package-name runtime resolution
        run: node scripts/verify-j3dena-vendor.mjs --require-runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser --workspace=jena-js
      - name: Install Chromium for the pinned Playwright CLI
        run: npx --yes --package @playwright/cli@0.1.18 playwright-cli install-browser chromium
      - name: Run the Open ENA 3D Data View and fullscreen smoke
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          OPEN_ENA_3D_CONTROLS_SMOKE_BROWSER: chromium
          OPEN_ENA_3D_CONTROLS_SMOKE_ARTIFACT_DIR: output/playwright/open-ena-3d-controls-${{ github.sha }}-chromium
          PWTEST_DAEMON_SESSION_DIR: ${{ runner.temp }}/open-ena-playwright-daemon-3d-controls
        run: npm run test:browser:open-ena-3d-controls
      - name: Run the full Open ENA longitudinal application smoke
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          OPEN_ENA_LONGITUDINAL_SMOKE_BROWSER: chromium
          OPEN_ENA_LONGITUDINAL_SMOKE_ARTIFACT_DIR: output/playwright/open-ena-longitudinal-v3-${{ github.sha }}-chromium
          PWTEST_DAEMON_SESSION_DIR: ${{ runner.temp }}/open-ena-playwright-daemon
        run: npm run test:browser:longitudinal-v3
      - name: Upload Open ENA longitudinal browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-ena-longitudinal-v3-evidence-${{ github.sha }}-chromium
          path: output/playwright/open-ena-longitudinal-v3-${{ github.sha }}-chromium
          if-no-files-found: error
          retention-days: 14
      - name: Upload Open ENA 3D controls browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-ena-3d-controls-evidence-${{ github.sha }}-chromium
          path: output/playwright/open-ena-3d-controls-${{ github.sha }}-chromium
          if-no-files-found: error
          retention-days: 14
