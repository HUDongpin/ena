name: Open ENA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-ena-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Verify the ECS authentication runtime operator
        run: python3 -B -m unittest discover -s tests -p 'test_ecs_auth_operator.py' -v
      - name: Verify vendored j-3dENA custody before dependency installation
        run: node scripts/verify-j3dena-vendor.mjs
      - run: npm ci
      - name: Verify complete installed j-3dENA tree and jENA workspace peer
        run: node scripts/verify-j3dena-vendor.mjs --require-installed
      - name: Audit the production dependency graph
        run: npm audit --omit=dev
      - name: Reject high or critical development-tool advisories
        run: npm audit --audit-level=high
      - name: Verify prompt governance and complete application
        run: npm run verify
      - name: Package and verify the standalone Linux release
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .next/standalone/public .next/standalone/.next/static .next/standalone/migrations
          cp -a public/. .next/standalone/public/
          cp -a .next/static/. .next/standalone/.next/static/
          cp -a migrations/. .next/standalone/migrations/
          if find .next/standalone -name '.env*' -print -quit | grep -q .; then
            echo 'Refusing to package environment files.' >&2
            exit 1
          fi
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync(".next/standalone/release.json", JSON.stringify({commit:process.env.GITHUB_SHA,platform:process.platform,arch:process.arch,node:process.version},null,2)+"\n")'
          mkdir -p output/release
          tar -C .next/standalone -czf "output/release/ena-linux-x64-${GITHUB_SHA}.tar.gz" .
          (cd output/release && sha256sum "ena-linux-x64-${GITHUB_SHA}.tar.gz" > SHA256SUMS)
          smoke_dir=$(mktemp -d "${RUNNER_TEMP}/ena-release-smoke.XXXXXX")
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -C "$smoke_dir" -xzf "output/release/ena-linux-x64-${GITHUB_SHA}.tar.gz"
          node scripts/smoke-standalone-release.mjs "$smoke_dir" "$GITHUB_SHA" > output/release/smoke.json
      - name: Upload the verified standalone Linux release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ena-linux-x64-${{ github.sha }}
          path: output/release
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: open_ena_ci
          POSTGRES_PASSWORD: open_ena_ci_password_2026
          POSTGRES_DB: open_ena_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_ena_ci -d open_ena_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      OPEN_ENA_CI_DATABASE_URL: postgresql://open_ena_ci:open_ena_ci_password_2026@127.0.0.1:5432/open_ena_ci
      OPEN_ENA_USERNAME: open_ena_ci_researcher
      OPEN_ENA_PASSWORD: open_ena_ci_password_2026
      OPEN_ENA_SESSION_SECRET: open_ena_ci_session_secret_0123456789abcdef
      OPEN_ENA_ACCOUNT_ID: open-ena-ci-account
      OPEN_ENA_PUBLIC_ORIGIN: http://127.0.0.1
      OPEN_ENA_ALLOWED_ORIGINS: http://127.0.0.1
      OPEN_ENA_TRUSTED_CLIENT_IP_HEADER: x-ena-client-ip
      OPEN_ENA_AUTH_DATABASE_URL: postgresql://open_ena_ci:open_ena_ci_password_2026@127.0.0.1:5432/open_ena_ci
      OPEN_ENA_BILLING_POLICY_VERSION: v1
      OPEN_ENA_BILLABLE_REQUESTS_PER_MINUTE: "6"
      OPEN_ENA_AI_DAILY_MICRO_USD: "100000"
      OPEN_ENA_AI_MONTHLY_MICRO_USD: "500000"
      OPEN_ENA_GLOBAL_MONTHLY_MICRO_USD: "2000000"
      OPEN_ENA_PROVIDER_MONTHLY_MICRO_USD: "2000000"
      OPEN_ENA_AI_MAX_RESERVATION_MICRO_USD: "10000"
      OPEN_ENA_LONGITUDINAL_MAX_RESERVATION_MICRO_USD: "20000"
      OPEN_ENA_BILLABLE_MAX_CONCURRENCY: "2"
      OPEN_ENA_SECURITY_ALERT_THRESHOLDS: 50,80,100
      OPEN_ENA_BILLABLE_DATABASE_URL: postgresql://open_ena_ci:open_ena_ci_password_2026@127.0.0.1:5432/open_ena_ci
      OPEN_ENA_AI_ENABLED: "false"
      # The hosted runner has no supported GPU. Opt in only in our disposable
      # Chromium process, which serves this checkout and synthetic data on loopback.
      OPEN_ENA_BROWSER_GRAPHICS: swiftshader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Verify vendored j-3dENA custody before dependency installation
        run: node scripts/verify-j3dena-vendor.mjs
      - name: Make PostgreSQL binaries available to owned browser test databases
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Initialize isolated Open ENA PostgreSQL schema in migration order
        run: |
          set -euo pipefail
          for migration in migrations/001_open_ena_billable.sql migrations/002_open_ena_auth_security.sql migrations/003_open_ena_ai_consent.sql migrations/004_open_ena_disposable_accounts.sql migrations/005_ena_plugin_lab.sql migrations/006_open_ena_billable_leases.sql migrations/007_open_ena_ai_consent_idempotency.sql migrations/008_open_ena_disposable_expiry_after_lock.sql migrations/009_open_ena_login_failure_windows.sql; do
            echo "Applying ${migration}"
            psql "${OPEN_ENA_CI_DATABASE_URL}" --set ON_ERROR_STOP=1 --file "${migration}"
          done
      - run: npm ci
      - name: Verify complete installed j-3dENA tree and jENA workspace peer
        run: node scripts/verify-j3dena-vendor.mjs --require-installed
      - name: Build the pinned jENA workspace
        run: npm run jena:build
      - name: Verify j-3dENA through package-name runtime resolution
        run: node scripts/verify-j3dena-vendor.mjs --require-runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser --workspace=jena-js
      - name: Run the Models v3 accessible tabs browser gate
        run: npm run test:browser:open-ena-model-v3-tabs
      - name: Run the Models v3 Units controls browser gate
        run: npm run test:browser:open-ena-model-v3-units
      - name: Run the Models v3 Horizons and ordering browser gate
        run: npm run test:browser:open-ena-model-v3-horizons
      - name: Run the Models v3 Windows controls browser gate
        run: npm run test:browser:open-ena-model-v3-windows
      - name: Run the Models v3 Codes controls browser gate
        run: npm run test:browser:open-ena-model-v3-codes
      - name: Run the Rebuild Cancel pointer hit-target gate
        run: npm run test:browser:open-ena-rebuild-cancel-pointer
      - name: Run the AI explicit retry browser gate
        run: npm run test:browser:open-ena-ai-retry
      - name: Run the AI presentation identity browser gate
        run: npm run test:browser:open-ena-ai-presentation-retention
      - name: Run the AI interpretation retention workspace browser gate
        run: npm run test:browser:open-ena-ai-interpretation-retention
      - name: Run the keyboard focus-recovery gate
        run: npm run test:browser:open-ena-focus-recovery
      - name: Run the workspace landmarks and narrow-viewport gate
        run: npm run test:browser:open-ena-a11y-landmarks
      - name: Run the stale source-replacement Rebuild cue gate
        run: npm run test:browser:open-ena-stale-rebuild-cue
      - name: Run the teaching sample execution-plan recovery gate
        run: node tests/open-ena-teaching-sample-progress-browser.mjs
      - name: Install Chromium for the pinned Playwright CLI
        run: npx --yes --package @playwright/cli@0.1.18 playwright-cli install-browser chromium
      - name: Run the Open ENA 3D Data View and fullscreen smoke
        id: open_ena_3d_smoke
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          OPEN_ENA_3D_CONTROLS_SMOKE_BROWSER: chromium
          OPEN_ENA_3D_CONTROLS_SMOKE_ARTIFACT_DIR: output/playwright/open-ena-3d-controls-${{ github.sha }}-chromium
          PWTEST_DAEMON_SESSION_DIR: ${{ runner.temp }}/open-ena-playwright-daemon-3d-controls
        run: npm run test:browser:open-ena-3d-controls
      - name: Upload Open ENA 3D controls browser evidence
        if: ${{ always() && !cancelled() && steps.open_ena_3d_smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-ena-3d-controls-evidence-${{ github.sha }}-chromium
          path: |
            output/playwright/open-ena-3d-controls-${{ github.sha }}-chromium
            output/playwright/open-ena-3d-controls-${{ github.sha }}-chromium-runtime/*.json
            output/playwright/open-ena-3d-controls-${{ github.sha }}-chromium-runtime/*.log
          if-no-files-found: error
          retention-days: 14
      - name: Run the full Open ENA longitudinal application smoke
        id: open_ena_longitudinal_smoke
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          OPEN_ENA_LONGITUDINAL_SMOKE_BROWSER: chromium
          OPEN_ENA_LONGITUDINAL_SMOKE_ARTIFACT_DIR: output/playwright/open-ena-longitudinal-v3-${{ github.sha }}-chromium
          PWTEST_DAEMON_SESSION_DIR: ${{ runner.temp }}/open-ena-playwright-daemon
        run: npm run test:browser:longitudinal-v3
      - name: Upload Open ENA longitudinal browser evidence
        if: ${{ always() && !cancelled() && steps.open_ena_longitudinal_smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-ena-longitudinal-v3-evidence-${{ github.sha }}-chromium
          path: output/playwright/open-ena-longitudinal-v3-${{ github.sha }}-chromium
          if-no-files-found: error
          retention-days: 14
      - name: Run the Open ENA code label drag regression
        id: open_ena_node_drag_smoke
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          OPEN_ENA_NODE_DRAG_SMOKE_BROWSER: chromium
          OPEN_ENA_NODE_DRAG_SMOKE_ARTIFACT_DIR: output/playwright/open-ena-node-drag-${{ github.sha }}-chromium
        run: npm run test:browser:open-ena-node-drag
      - name: Upload Open ENA code label drag evidence
        if: ${{ always() && !cancelled() && steps.open_ena_node_drag_smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-ena-node-drag-evidence-${{ github.sha }}-chromium
          path: |
            output/playwright/open-ena-node-drag-${{ github.sha }}-chromium
            output/playwright/open-ena-node-drag-${{ github.sha }}-chromium-runtime/*.json
            output/playwright/open-ena-node-drag-${{ github.sha }}-chromium-runtime/*.log
          if-no-files-found: error
          retention-days: 14
      - name: Run the Open ENA Group exclusion and retained plot layout regression
        id: open_ena_stale_plot_layout_smoke
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          OPEN_ENA_STALE_LAYOUT_ARTIFACT_DIR: output/playwright/open-ena-stale-plot-layout-${{ github.sha }}-chromium
        run: npm run test:browser:open-ena-stale-plot-layout
      - name: Upload Open ENA Group exclusion and retained plot layout evidence
        if: ${{ always() && !cancelled() && steps.open_ena_stale_plot_layout_smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-ena-stale-plot-layout-evidence-${{ github.sha }}-chromium
          path: |
            output/playwright/open-ena-stale-plot-layout-${{ github.sha }}-chromium
            output/playwright/open-ena-stale-plot-layout-${{ github.sha }}-chromium-runtime/*.json
            output/playwright/open-ena-stale-plot-layout-${{ github.sha }}-chromium-runtime/*.log
          if-no-files-found: error
          retention-days: 14
      - name: Run the Open ENA inference browser smoke
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          OPEN_ENA_SMOKE_BROWSER: chromium
          OPEN_ENA_SMOKE_ARTIFACT_DIR: output/playwright/open-ena-inference-${{ github.sha }}-chromium
        run: node tests/open-ena-inference-browser-smoke.mjs
      - name: Upload Open ENA inference browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-ena-inference-evidence-${{ github.sha }}-chromium
          path: output/playwright/open-ena-inference-${{ github.sha }}-chromium
          if-no-files-found: warn
          retention-days: 14
      - name: Run the Open ENA accessibility and performance browser smoke
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          OPEN_ENA_A11Y_PERF_SMOKE_ARTIFACT_DIR: output/playwright/open-ena-a11y-perf-${{ github.sha }}-chromium
        run: node tests/open-ena-a11y-perf-browser-smoke.mjs
      - name: Upload Open ENA accessibility and performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-ena-a11y-perf-evidence-${{ github.sha }}-chromium
          path: output/playwright/open-ena-a11y-perf-${{ github.sha }}-chromium
          if-no-files-found: warn
          retention-days: 14

  regressions:
    name: Reviewed regressions (Chromium and PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Verify vendored j-3dENA custody before dependency installation
        run: node scripts/verify-j3dena-vendor.mjs
      - name: Make PostgreSQL binaries available to owned regression databases
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run jena:build
      - run: npx playwright install --with-deps chromium
      - name: Verify populated database upgrades and transaction boundaries
        run: |
          mkdir -p output/review-regressions
          node tests/review-server-migration-006-upgrade.mjs --evidence-dir output/review-regressions/migration-006
          node tests/review-server-migration-007-upgrade.mjs --evidence-dir output/review-regressions/migration-007
          node --import tsx tests/review-server-migration-008-upgrade.mts --evidence-dir output/review-regressions/migration-008
          node --import tsx tests/open-ena-login-throttle-postgres.mts
          node --import tsx tests/review-server-plugin-transactions.mjs
      - name: Verify AI operation ownership, release proofs, and explicit retries
        run: |
          node tests/open-ena-ai-operation-retry-browser.mjs
          node tests/review-ui-ai-operation-ownership-browser.mjs output/review-regressions/ai-operation-ownership.json
          node --import tsx tests/review-ai-request-scope-browser.mts output/review-regressions/ai-request-scope.json
          for store in memory postgres; do
            node --import tsx tests/review-ai-owner-browser.mts "$store" "output/review-regressions/ai-owner-$store.json"
            for scenario in cancel remount local-epoch principal-change; do
              node --import tsx tests/review-ai-late-renewal-browser.mts "$PWD" "output/review-regressions/ai-late-$store-$scenario.json" "$scenario" "$store"
            done
          done
      - name: Verify localized native login and logout recovery
        run: node --import tsx tests/open-ena-login-recovery-browser.mts
      - name: Verify data admission, cancellation, consent, and import ownership
        run: |
          node --import tsx tests/ena-plugin-consent-binding-browser.mjs
          node tests/open-ena-legacy-zero-backward-browser.mjs
          node tests/open-ena-model-v3-order-clear-browser.mjs
          node tests/open-ena-pairwise-empty-group-browser.mjs
          node tests/open-ena-longitudinal-preparation-cancel-browser.mjs
          node tests/review-data-xlsx-browser.mjs
          node tests/review-artifact-utf8-browser.mjs output/review-regressions/artifact-utf8
          node tests/review-csv-utf8-browser.mjs output/review-regressions/csv-utf8
          node tests/review-ui-import-failure-ownership-browser.mjs output/review-regressions/import-ownership.json
          OPEN_ENA_REVIEW_REPORT=output/review-regressions/analytics-consent.json node tests/review-ui-analytics-consent-browser.mjs
      - name: Verify literal labels, current exports, and native controls
        run: |
          node --import tsx tests/review-plot-legend-browser.mts output/review-regressions/plot-legend chromium
          node --import tsx tests/review-plot-literal-browser.mts output/review-regressions/plot-literal chromium
          node tests/review-ui-reference-export-browser.mjs
          node tests/review-ui-source-order-disclosure-browser.mjs
          node tests/review-ui-native-button-spacing-browser.mjs
          REVIEW_RESULT_PATH=output/review-regressions/toolbar-image-export.json node tests/review-ui-toolbar-image-export-browser.mjs
      - name: Upload reviewed regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-ena-reviewed-regressions-${{ github.sha }}
          path: output/review-regressions
          if-no-files-found: warn
          retention-days: 14
